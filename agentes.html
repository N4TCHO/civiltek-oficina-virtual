<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Civiltek | Agentes IA</title><style>body{font:16px system-ui;background:#0b1627;color:#eaf3ff;max-width:850px;margin:auto;padding:22px}a{color:#69ded1}label{display:block;margin:18px 0 6px}input,select,textarea{width:100%;box-sizing:border-box;background:#16283e;color:white;border:1px solid #49647d;border-radius:9px;padding:12px;font:inherit}textarea{min-height:160px}button{margin:15px 0;padding:12px 18px;border:0;border-radius:9px;background:#35c1b3;color:#04141c;font-weight:700;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#13263b;padding:18px;border-radius:12px;line-height:1.6}.note{color:#b5c8db}</style></head><body><a href="/">← Civiltek</a><h1>Especialistas IA</h1><p class="note">Requiere servidor Civiltek configurado y clave OpenRouter. Los resultados son borradores y deben ser revisados antes de su uso profesional. El acceso se recuerda en esta pestaña hasta que la cierres.</p><label for="token">Token privado de acceso Civiltek</label><input id="token" type="password" autocomplete="off" placeholder="Token configurado en el servidor"><button id="forget" type="button">Cerrar acceso</button><label for="role">Especialista</label><select id="role"><option>Director</option><option>Licitaciones</option><option>Presupuestos</option><option>Calidad MOP</option><option>Documental</option><option>Comercial</option><option>Auditor</option></select><label for="instructions">Encargo</label><textarea id="instructions" placeholder="Ej.: Revisar estos antecedentes y redactar un borrador de carta técnica"></textarea><label for="context">Antecedentes adicionales</label><textarea id="context" placeholder="Pega aquí antecedentes sin datos personales sensibles"></textarea><button id="run">Solicitar borrador IA</button><p id="status" role="status"></p><pre id="result" aria-live="polite">Aún no se ha ejecutado ningún encargo.</pre><script>
const $=id=>document.getElementById(id);const K="civiltek_session_token";$("token").value=sessionStorage.getItem(K)||"";$("token").addEventListener("input",()=>{if($("token").value.trim())sessionStorage.setItem(K,$("token").value.trim());else sessionStorage.removeItem(K)});$("forget").onclick=()=>{sessionStorage.removeItem(K);$("token").value="";$("status").textContent="Acceso cerrado en esta pestaña."};$("run").onclick=async()=>{let token=$("token").value.trim(),instructions=$("instructions").value.trim();if(!token||instructions.length<3)return alert("Indica token y encargo.");$("run").disabled=true;$("status").textContent="Consultando proveedor de IA…";try{let response=await fetch("/api/agents/run",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({role:$("role").value,instructions,context:$("context").value})});if(!response.ok){let err=await response.json().catch(()=>({}));throw Error(err.detail||"Error "+response.status)}let data=await response.json();$("result").textContent=data.draft;$("status").textContent="Borrador recibido. Requiere revisión humana."}catch(e){$("status").textContent="No se pudo ejecutar: "+e.message}finally{$("run").disabled=false}};
</script></body></html>
