<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Civiltek Clientes</title><style>body{font:16px system-ui;background:#0b1627;color:#e9f3ff;max-width:850px;margin:auto;padding:20px}section{background:#182b40;padding:18px;margin:15px 0;border-radius:12px}input,textarea,select{width:100%;box-sizing:border-box;background:#0b1627;color:white;padding:10px;margin:6px 0;border:1px solid #61758a;border-radius:7px}button{background:#3dc4b5;border:0;border-radius:7px;padding:12px;margin:6px;font-weight:bold}a{color:#79dfd3}.item{border-bottom:1px solid #5d7289;padding:14px}</style><a href="/">Inicio</a> · <a href="/oficina">Oficina</a><h1>Clientes y encargos</h1><p>Registro administrativo interno. Cada encargo puede enviarse a los agentes de Civiltek.</p><section id="access"><input id="key" type="password" placeholder="Clave Civiltek"><button id="login">Ingresar</button></section><button id="logout">Cerrar sesión</button><section><h2>Nuevo cliente</h2><input id="name" placeholder="Empresa o persona"><input id="contact" placeholder="Contacto"><button id="newclient">Registrar cliente</button></section><section><h2>Nuevo encargo</h2><select id="client"></select><select id="service"><option>Prevención de Riesgos</option><option>Medio Ambiente</option><option>Legal y Contratos</option><option>Auditoría y Calidad</option><option>Ingeniería y Obras</option><option>Licitaciones</option><option>Presupuestos y APU</option><option>Recursos Humanos</option><option>Topografía y GIS</option><option>Consultoría integral</option></select><textarea id="objective" placeholder="Describe el documento o trabajo requerido"></textarea><textarea id="context" placeholder="Antecedentes y condiciones"></textarea><input id="deadline" type="date"><button id="newrequest">Registrar encargo</button></section><section><h2>Bandeja de encargos</h2><button id="reload">Actualizar</button><p id="status"></p><div id="items"></div></section><script>
const $=x=>document.getElementById(x);
async function api(path,method="GET",body){const r=await fetch(path,{method,credentials:"same-origin",headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||"Error "+r.status);return d}
async function auth(){const d=await api("/api/auth/status");$("access").hidden=d.authenticated;$("logout").hidden=!d.authenticated;if(d.authenticated)await load()}
$("login").onclick=async()=>{try{await api("/api/auth/login","POST",{password:$("key").value});$("key").value="";await auth()}catch(e){$("status").textContent=e.message}};
$("logout").onclick=async()=>{await api("/api/auth/logout","POST");$("items").replaceChildren();await auth()};
$("newclient").onclick=async()=>{try{await api("/api/clients","POST",{name:$("name").value,contact:$("contact").value});$("name").value="";await load()}catch(e){$("status").textContent=e.message}};
$("newrequest").onclick=async()=>{try{await api("/api/client-requests","POST",{client_id:$("client").value,service:$("service").value,objective:$("objective").value,context:$("context").value,deadline:$("deadline").value});$("objective").value="";await load()}catch(e){$("status").textContent=e.message}};
async function load(){try{const clients=await api("/api/clients"),jobs=await api("/api/client-requests");$("client").replaceChildren();clients.forEach(c=>{const o=document.createElement("option");o.value=c.id;o.textContent=c.title;$("client").append(o)});$("items").replaceChildren();jobs.forEach(j=>{const p=j.payload,div=document.createElement("div"),h=document.createElement("h3"),desc=document.createElement("p");div.className="item";h.textContent=p.client_name+" · "+p.service;desc.textContent=p.objective+" — "+p.status;div.append(h,desc);if(p.office_id){const a=document.createElement("a");a.href="/api/office/"+encodeURIComponent(p.office_id)+"/docx";a.textContent="Descargar expediente Word";div.append(a)}else{const b=document.createElement("button");b.textContent="Asignar a especialistas";b.onclick=async()=>{b.disabled=true;$("status").textContent="Agentes trabajando…";try{await api("/api/client-requests/"+encodeURIComponent(j.id)+"/dispatch","POST");await load();$("status").textContent="Expediente preparado para revisión."}catch(e){$("status").textContent=e.message}finally{b.disabled=false}};div.append(b)}$("items").append(div)})}catch(e){$("status").textContent=e.message}}
$("reload").onclick=load;auth();
</script>
