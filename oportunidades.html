<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Civiltek | Oportunidades</title><style>body{font:16px system-ui;background:#0b1728;color:#eef5ff;max-width:900px;margin:auto;padding:20px}section{padding:18px;border-radius:12px;background:#16283e;margin:16px 0}input{width:100%;box-sizing:border-box;background:#0b1728;color:white;padding:12px;border:1px solid #567087;border-radius:8px}button{background:#40c6b4;border:0;border-radius:8px;padding:12px;margin:8px 5px 8px 0;font-weight:bold}a{color:#71dfd1}.item{border-bottom:1px solid #4c647c;padding:12px}small{color:#b5c8db}</style><a href="/">Inicio</a> · <a href="/clientes">Clientes</a><h1>Radar de oportunidades</h1><p>Consulta oficial de licitaciones activas en Mercado Público. Filtra por palabras clave y conserva oportunidades sin duplicados.</p><section id="access"><input id="password" type="password" placeholder="Clave de Civiltek"><button id="login">Iniciar sesión</button></section><section><h2>ChileCompra</h2><p id="config"></p><label>Palabras clave, separadas por comas</label><input id="terms" value="asesoría, prevención de riesgos, medio ambiente, auditoría, ingeniería, topografía, conservación vial, consultoría"><button id="scan">Buscar oportunidades</button><button id="refresh">Ver guardadas</button><p id="status" role="status"></p></section><section><h2>Oportunidades detectadas</h2><div id="results"></div></section><script>
const $=x=>document.getElementById(x);
async function api(url,method="GET",data){const r=await fetch(url,{method,credentials:"same-origin",headers:data?{"Content-Type":"application/json"}:{},body:data?JSON.stringify(data):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.detail||"Error "+r.status);return j}
async function init(){try{const s=await api("/api/auth/status");$("access").hidden=s.authenticated;if(!s.authenticated)return;const c=await api("/api/integrations/status");$("config").textContent=c.mercado_publico.configured?"Conector ChileCompra configurado.":"Falta ticket de ChileCompra en Railway; búsqueda aún no disponible.";await list()}catch(e){$("status").textContent=e.message}}
$("login").onclick=async()=>{try{await api("/api/auth/login","POST",{password:$("password").value});$("password").value="";await init()}catch(e){$("status").textContent=e.message}};
$("scan").onclick=async()=>{if($("scan").disabled)return;$("scan").disabled=true;$("status").textContent="Consultando licitaciones activas…";try{const d=await api("/api/opportunities/scan","POST",{terms:$("terms").value.split(",").map(x=>x.trim()).filter(Boolean)});$("status").textContent=d.matches+" coincidencias, "+d.new_saved+" nuevas guardadas. Requieren evaluación.";await list()}catch(e){$("status").textContent=e.message}finally{$("scan").disabled=false}};
async function list(){const items=await api("/api/opportunities");$("results").replaceChildren();for(const item of items){const p=item.payload,div=document.createElement("div"),title=document.createElement("h3"),desc=document.createElement("p"),small=document.createElement("small");div.className="item";title.textContent=p.name;desc.textContent=p.description||"Sin descripción";small.textContent="Código: "+p.code+" · Cierre: "+(p.close_date||"Verificar")+" · "+p.source;div.append(title,desc,small);$("results").append(div)}if(!items.length)$("results").textContent="Sin oportunidades guardadas."}
$("refresh").onclick=()=>list().catch(e=>$("status").textContent=e.message);init();
</script>
