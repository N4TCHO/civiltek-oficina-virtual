<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Civiltek | Cartas</title><style>body{font:16px system-ui;background:#0b1627;color:#eef5ff;max-width:850px;margin:auto;padding:20px}input,textarea{display:block;width:100%;box-sizing:border-box;background:#16273e;border:1px solid #526a84;border-radius:8px;color:white;padding:12px;margin:7px 0 17px}textarea{min-height:210px}button,a.action{background:#35b9ab;border:0;border-radius:8px;color:#061720;padding:12px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;margin:4px}article{border:1px solid #344960;border-radius:10px;padding:15px;margin:10px 0}small{color:#b6c9db}</style></head><body><a href="./index.html">← Volver a Civiltek</a><h1>Gestión de cartas</h1><p>Crear borradores, revisar correlativos y descargar cartas en texto. Los datos se guardan solo en este navegador; no hay sincronización ni firma electrónica.</p><label>Correlativo</label><input id="number" type="number" min="1" placeholder="Ej.: 193"><label>Fecha</label><input id="date" type="date"><label>Destinatario</label><input id="to" placeholder="Nombre y cargo"><label>Materia</label><input id="subject" placeholder="Presentación de antecedentes"><label>Contenido</label><textarea id="body" placeholder="De nuestra consideración:"></textarea><label>Firmante</label><input id="signer" placeholder="Nombre y cargo"><button id="save">Guardar borrador</button><button id="download">Descargar carta TXT</button><h2>Registro local</h2><div id="list"></div><script>
const $=x=>document.getElementById(x),key="civiltek_letters_v1";let letters=[];try{let a=JSON.parse(localStorage.getItem(key)||"[]");if(Array.isArray(a))letters=a}catch{}$("date").value=new Date().toLocaleDateString("en-CA");const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function get(){return {id:Date.now()+"-"+Math.random(),number:$("number").value||"S/N",date:$("date").value,to:$("to").value,subject:$("subject").value,body:$("body").value,signer:$("signer").value}}function content(l){return ["CARTA N.º "+l.number,l.date,"","A: "+l.to,"MAT.: "+l.subject,"",l.body,"","Atentamente,",l.signer].join("\n")}function download(l){let url=URL.createObjectURL(new Blob([content(l)],{type:"text/plain;charset=utf-8"})),a=document.createElement("a");a.href=url;a.download="carta-"+String(l.number).replace(/[^a-z0-9-]/gi,"_")+".txt";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function render(){$("list").innerHTML=letters.length?letters.map((l,i)=>'<article><strong>Carta '+escapeHtml(l.number)+'</strong> · '+escapeHtml(l.subject)+'<p><small>'+escapeHtml(l.date)+' · '+escapeHtml(l.to)+'</small></p><button data-d="'+i+'">Descargar</button><button data-x="'+i+'">Eliminar</button></article>').join(""):"Aún no hay cartas guardadas.";document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>download(letters[Number(b.dataset.d)]));document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{if(confirm("¿Eliminar borrador?")){letters.splice(Number(b.dataset.x),1);persist()}})}function persist(){localStorage.setItem(key,JSON.stringify(letters));render()}$("save").onclick=()=>{let l=get();if(!l.subject.trim()||!l.body.trim())return alert("Completa materia y contenido.");if(letters.some(x=>x.number===l.number)&&!confirm("Número repetido. ¿Guardar igual?"))return;letters.unshift(l);persist();alert("Borrador guardado")};$("download").onclick=()=>download(get());render();
</script></body></html>
